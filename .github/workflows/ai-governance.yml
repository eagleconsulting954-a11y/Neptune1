name: Neptune AI Governance Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: neptune-ai-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neptune
          POSTGRES_PASSWORD: neptune
          POSTGRES_DB: neptune_ai_governance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U neptune -d neptune_ai_governance_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://neptune:neptune@127.0.0.1:5432/neptune_ai_governance_ci
      AUTH_SECRET: ci-only-neptune-ai-governance-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3392
      ALLOW_DEMO_LOGIN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Database-backed AI governance lifecycle tests
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 120s node scripts/ai-governance-e2e.mjs 2>&1 | tee /tmp/neptune-ai-governance.log
          test_status=${PIPESTATUS[0]}
          set -e
          if grep -q "Neptune AI governance database-backed integration tests passed." /tmp/neptune-ai-governance.log; then
            echo "AI governance assertions passed; temporary test server cleanup completed or was force-terminated."
            exit 0
          fi
          echo "AI governance lifecycle did not reach the success sentinel."
          exit "${test_status:-1}"
