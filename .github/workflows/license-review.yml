name: Neptune Dependency License Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Review dependency licenses
        run: node scripts/license-scan.mjs

      - name: Upload license evidence
        uses: actions/upload-artifact@v4
        with:
          name: neptune-license-report
          path: license-report.json
          if-no-files-found: error
          retention-days: 30
